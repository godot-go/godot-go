name: godot-go CI on Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "**/*.gdextension"
      - ".github/workflows/ci_windows.yaml"

  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "**/*.gdextension"
      - ".github/workflows/ci_windows.yaml"

jobs:
  run_test:
    name: "run tests"
    strategy:
      fail-fast: true
      matrix:
        targets:
          - windows/amd64
    runs-on: windows-latest
    env:
      GODOT: ./Godot_v4.7-stable_win64.exe
    timeout-minutes: 20
    steps:
      - name: Add Go 1.27 To System Path
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go version
      - name: Set up scoop
        uses: MinoruSekine/setup-scoop@main
        with:
          scoop_checkup: 'true'
      - name: Set up scoop extras
        run: scoop bucket add extras;
      - name: Install scoop packages
        run: scoop install wget unzip
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Godot 4.7 stable
        run: |
          wget https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
          unzip Godot_v4.7-stable_win64.exe.zip -d ./
        shell: bash

      # Download custom build of godot for windows
      # - name: Download Godot binary
      #   uses: dawidd6/action-download-artifact@v2
      #   with:
      #     workflow: ci_build_godot_windows.yaml
      #     workflow_conclusion: success
      #     name: godot-windows-editor-amd64
      #     path: bin/

      - name: Update Godot Headers
        run: |
          make update_godot_headers_from_binary

      - name: Code Generation
        run: |
          PATH=$PATH:$(go env GOPATH)/bin make generate
        shell: bash

      - name: Build
        run: make build
        shell: bash

      - name: List Artifacts Directory
        run: |
          ls -alh test/demo/lib
          ls -alh test/demo/
        shell: bash

      - name: Gen Test Project Files
        timeout-minutes: 3
        run: make ci_gen_test_project_files
        env:
          CI: 1
          LOG_LEVEL: "debug"
          LANG: "en_US.utf8"

      - name: Test
        timeout-minutes: 7
        run: make test
        shell: bash
        env:
          CI: 1
          LOG_LEVEL: "debug"
          LANG: "en_US.utf8"

      # The teardown fault is fixed by pinning the Go module (the runtime
      # cannot be unloaded), so the Test step gates the job again. Keep the
      # capture-evidence assertion: the runtime gate's stacktrace rules alone
      # would not catch a silently broken Windows capture.
      - name: Verify Stacktrace Capture Evidence
        run: |
          # Windows capture is compiled in by default and resolves frames from
          # the DLL's embedded DWARF. A capture=0 probe line now means the
          # build is broken, not that it opted out.
          grep -qa 'stacktrace-probe capture=1' test-output.log || {
            echo "::error::stacktrace probe did not report native capture available"
            exit 1
          }
          grep -qa '___ C start backtrace ___' test-output.log || {
            echo "::error::capture reported available but no backtrace banner was printed"
            exit 1
          }
          # At least one captured frame must name its source line. If DWARF
          # loading silently stops, frames degrade to offset-only and every
          # check above still looks healthy.
          awk '/___ C start backtrace ___/{inb=1} inb{print} /___ C end backtrace/{if(inb) exit}' test-output.log \
            | grep -qaE '[A-Za-z0-9_.-]+\.(c|h|s):[0-9]+' || {
            echo "::error::no captured frame carried file:line — the DLL's embedded DWARF was not resolved"
            exit 1
          }
          # DbgHelp must be gone: the string would only be present if the DLL
          # still imported it (or a source path mentioned it).
          if grep -aqi 'dbghelp.dll' test/demo/lib/*.dll; then
            echo "::error::the extension DLL still references dbghelp.dll"
            exit 1
          fi
          echo "windows stacktrace capture verified"
        shell: bash

      # A trace pasted from CI must be resolvable after the fact: keep the
      # debug library and the run log so module+0xoffset frames can be fed to
      # `go tool addr2line` offline. Uploaded unconditionally so the evidence
      # exists even when a later step trips over the masked teardown failure.
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-lib
          path: |
            test-output.log
            test/demo/lib/*.dll
            !test/demo/lib/~*
          if-no-files-found: warn
          retention-days: 14
