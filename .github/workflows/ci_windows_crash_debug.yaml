name: godot-go CI on Windows (teardown crash debug)

# Diagnostics-only for issue #172: nothing here gates normal PR CI (the
# workflow is dispatch-only). The teardown crash fires where the process's
# own exception handlers are demonstrably silent AND where the kernel-side
# WER reporting does not dispatch (measured: run 39222394609 reproduced the
# crash twice with no minidump). The only path that still observes the
# event is a debug client — procdump catches the unhandled-exception
# debug event without gdb's synchronous event storm (measured: run
# 39220040720). See openspec/changes/diagnose-windows-teardown-crash/.

on:
  workflow_dispatch:

jobs:
  crash_debug:
    name: "capture teardown crash stack"
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GODOT: ./Godot_v4.7-stable_win64.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: Add Go 1.27 To System Path
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go version
      - name: Set up scoop
        uses: MinoruSekine/setup-scoop@main
        with:
          scoop_checkup: 'true'
      - name: Set up scoop extras
        run: scoop bucket add extras
      # NOTE: procdump is not in the official scoop buckets, and a failed
      # manifest aborts the whole `scoop install` list while exiting 0
      # (measured in run 39224207383) — so it is downloaded directly from
      # Sysinternals instead.
      - name: Install scoop packages
        run: scoop install wget unzip
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Godot 4.7 stable
        run: |
          wget https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
          unzip Godot_v4.7-stable_win64.exe.zip -d ./

      - name: Install procdump (direct from sysinternals)
        run: |
          wget https://download.sysinternals.com/files/Procdump.zip
          unzip Procdump.zip -d ./procdump
          test -x ./procdump/procdump.exe

      - name: Update Godot Headers
        run: make update_godot_headers_from_binary

      - name: Code Generation
        run: PATH=$PATH:$(go env GOPATH)/bin make generate

      - name: Build
        timeout-minutes: 10
        # the windows link uses lld (see Makefile DEBUG_INFO_EXTLDFLAGS); make
        # sure the runner's LLVM bin dir (which holds ld.lld) is reachable
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          command -v ld.lld || { echo "::error::ld.lld not found on PATH"; exit 1; }
          test -x ./procdump/procdump.exe || { echo "::error::procdump.exe not staged"; exit 1; }
          make build

      # WER LocalDumps stays registered as secondary evidence; the kernel
      # side of WER measured absent for this teardown phase, but keeping
      # the keys costs nothing and a dump appearing would be a bonus.
      - name: Register WER LocalDumps and prepare dump folder
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\Godot_v4.7-stable_win64.exe" /v DumpFolder /t REG_EXPAND_SZ /d "C:\crashdumps" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\Godot_v4.7-stable_win64.exe" /v DumpType /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\Godot_v4.7-stable_win64.exe" /v DumpCount /t REG_DWORD /d 10 /f
          New-Item -ItemType Directory -Force -Path C:\crashdumps | Out-Null
          Test-Path .\procdump\procdump.exe | ForEach-Object { if (-not $_) { throw "procdump.exe missing" } }

      - name: Plain control run (editor quit)
        timeout-minutes: 6
        run: |
          set +e
          bash -o pipefail -ec '
            CI=1 LOG_LEVEL=info GOTRACEBACK=1 \
            GODEBUG=gctrace=1,asyncpreemptoff=1,cgocheck=1,invalidptr=1,clobberfree=1,tracebackancestors=5 \
            "$0" --headless --verbose --path test/demo/ --editor --quit 2>&1 | tee plain-editor-quit.log
          ' "$GODOT"
          echo "$?" > plain-editor-quit.rc
          echo "plain-editor-quit exit code: $(cat plain-editor-quit.rc)"

      # The procdump runs launch the repro with procdump as its debugger:
      # -e writes a dump when the process dies with an unhandled exception
      # (second-chance debug event reaches a debug client even though no
      # in-process handler survives; design D1 v3). No symbol resolution,
      # so no gdb-style synchronous first-chance storm.
      - name: Procdump capture (editor quit repro)
        timeout-minutes: 8
        shell: pwsh
        run: |
          $env:CI = '1'
          $env:LOG_LEVEL = 'info'
          $env:GOTRACEBACK = '1'
          $env:GODEBUG = 'gctrace=1,asyncpreemptoff=1,cgocheck=1,invalidptr=1,clobberfree=1,tracebackancestors=5'
          .\procdump\procdump.exe -accepteula -e -o C:\crashdumps\editor-quit.dmp -x .\Godot_v4.7-stable_win64.exe --headless --verbose --path test/demo/ --editor --quit 2>&1 | Tee-Object procdump-editor-quit.log
          Write-Output "procdump editor-quit exit: $LASTEXITCODE"

      - name: Procdump capture (suite phase 1)
        timeout-minutes: 12
        shell: pwsh
        run: |
          $env:CI = '1'
          $env:LOG_LEVEL = 'warn'
          $env:GOTRACEBACK = 'single'
          $env:GODEBUG = 'gctrace=1,asyncpreemptoff=1,cgocheck=1,invalidptr=1,clobberfree=1'
          .\procdump\procdump.exe -accepteula -e -o C:\crashdumps\suite.dmp -x .\Godot_v4.7-stable_win64.exe --headless --verbose --path test/demo/ --quit-after 12 2>&1 | Tee-Object procdump-suite.log
          Write-Output "procdump suite exit: $LASTEXITCODE"

      # The job is red unless a symbolizable minidump exists — an
      # exit-code-only reproduction no longer paints the job green, because
      # the whole point is the faulting stack (design D2/D3).
      - name: Assert a minidump was captured
        timeout-minutes: 3
        shell: pwsh
        run: |
          $dumps = Get-ChildItem -Path C:\crashdumps -Filter *.dmp -ErrorAction SilentlyContinue
          if (-not $dumps -or @($dumps).Count -lt 1) {
            Write-Output "::error::no minidump captured — the teardown crash did not reach the procdump debug event (check the plain control run reproduced it at all)"
            exit 1
          }
          foreach ($d in $dumps) {
            Write-Output ("dump: " + $d.FullName + " (" + [math]::Round($d.Length / 1MB, 1) + " MB)")
          }
          Write-Output "GODOTGO_CRASH_EVIDENCE: captured"

      - name: Check crashdumps
        shell: pwsh
        run: |
          if (Test-Path C:\crashdumps) { Get-ChildItem C:\crashdumps | Format-Table Name, Length } else { Write-Output "no crashdumps folder" }

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-crash-evidence
          path: |
            plain-editor-quit.log
            plain-editor-quit.rc
            procdump-editor-quit.log
            procdump-suite.log
            test/demo/lib/*.dll
            test/demo/lib/*.pdb
            !test/demo/lib/~*
            C:\crashdumps\**
          if-no-files-found: warn
          retention-days: 14
