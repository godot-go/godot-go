name: godot-go CI on Windows (teardown crash debug)

# Diagnostics-only for issue #172: nothing here gates normal PR CI (the
# workflow is dispatch-only). The teardown crash fires where the process's
# own exception handlers are demonstrably silent, so the crash capture is
# WER LocalDumps on plain (uninstrumented) repro runs; gdb was measured
# infeasible (run 39220040720: 6 s repro -> >12 min with no stop).
# See openspec/changes/diagnose-windows-teardown-crash/.

on:
  workflow_dispatch:

jobs:
  crash_debug:
    name: "capture teardown crash stack"
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GODOT: ./Godot_v4.7-stable_win64.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: Add Go 1.27 To System Path
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go version
      - name: Set up scoop
        uses: MinoruSekine/setup-scoop@main
        with:
          scoop_checkup: 'true'
      - name: Set up scoop extras
        run: scoop bucket add extras
      - name: Install scoop packages
        run: scoop install wget unzip
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Godot 4.7 stable
        run: |
          wget https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
          unzip Godot_v4.7-stable_win64.exe.zip -d ./

      - name: Update Godot Headers
        run: make update_godot_headers_from_binary

      - name: Code Generation
        run: PATH=$PATH:$(go env GOPATH)/bin make generate

      - name: Build
        timeout-minutes: 10
        # the windows link uses lld (see Makefile DEBUG_INFO_EXTLDFLAGS); make
        # sure the runner's LLVM bin dir (which holds ld.lld) is reachable
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          command -v ld.lld || { echo "::error::ld.lld not found on PATH"; exit 1; }
          make build

      # WER LocalDumps captures the dying process from the kernel side — the
      # only mechanism that still observes the crash where in-process
      # exception dispatch is dead (design D1/D2).
      - name: Register WER LocalDumps
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\Godot_v4.7-stable_win64.exe" /v DumpFolder /t REG_EXPAND_SZ /d "C:\crashdumps" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\Godot_v4.7-stable_win64.exe" /v DumpType /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\Godot_v4.7-stable_win64.exe" /v DumpCount /t REG_DWORD /d 10 /f

      # Repro 1 is the gen-step crash itself: `godot --headless --verbose
      # --path test/demo/ --editor --quit` hits Error 2816 (access violation)
      # in the normal CI gen step, so this is the ~10 s deterministic
      # version of the same teardown crash. The pipeline records the exit
      # code of the godot subprocess; 139 (msys decoration of STATUS_
      # ACCESS_VIOLATION) is the crash signature here.
      - name: Plain repro run (editor quit)
        timeout-minutes: 6
        run: |
          set +e
          bash -o pipefail -ec '
            CI=1 LOG_LEVEL=info GOTRACEBACK=1 \
            GODEBUG=gctrace=1,asyncpreemptoff=1,cgocheck=1,invalidptr=1,clobberfree=1,tracebackancestors=5 \
            "$0" --headless --verbose --path test/demo/ --editor --quit 2>&1 | tee plain-editor-quit.log
          ' "$GODOT"
          echo "$?" > plain-editor-quit.rc
          echo "plain-editor-quit exit code: $(cat plain-editor-quit.rc)"

      # Repro 2 replays the entire suite phase-1 command line from `make
      # test` (the mode where the crash was originally observed, exit 139).
      - name: Plain repro run (suite phase 1)
        timeout-minutes: 15
        run: |
          set +e
          bash -o pipefail -ec '
            CI=1 LOG_LEVEL=WARN GOTRACEBACK=single \
            GODEBUG=gctrace=1,asyncpreemptoff=1,cgocheck=1,invalidptr=1,clobberfree=1 \
            "$0" --headless --verbose --path test/demo/ --quit-after 12 2>&1 | tee test-output.log
          ' "$GODOT"
          echo "$?" > plain-suite.rc
          echo "plain-suite exit code: $(cat plain-suite.rc)"

      # The job is red unless at least one crash signature was captured:
      # either WER wrote a minidump, or a run's exit code records the access
      # violation. Silent empty runs are impossible (design D3).
      - name: Assert crash evidence captured
        timeout-minutes: 3
        run: |
          captured=0
          if [ -d /c/crashdumps ] && compgen -G '/c/crashdumps/*.dmp' >/dev/null; then
            echo "WER LocalDumps produced crash dumps"
            captured=1
          fi
          for rcfile in plain-editor-quit.rc plain-suite.rc; do
            [ -f "$rcfile" ] || continue
            rc="$(cat "$rcfile")"
            if [ "$rc" = "139" ] || [ "$rc" = "2816" ]; then
              echo "$rcfile records crash exit code $rc"
              captured=1
            fi
          done
          if [ "$captured" -ne 1 ]; then
            echo "::error::none of the repro runs recorded a crash (no WER dump, no 139/2816 exit code) — the teardown crash did not reproduce"
            exit 1
          fi
          echo "GODOTGO_CRASH_EVIDENCE: captured"

      - name: Check crashdumps
        run: ls -alh /c/crashdumps 2>/dev/null || echo "no WER dumps were written"

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-crash-evidence
          path: |
            plain-editor-quit.log
            plain-editor-quit.rc
            plain-suite.rc
            test-output.log
            C:\crashdumps\**
          if-no-files-found: warn
          retention-days: 14
