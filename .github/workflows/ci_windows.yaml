name: godot-go CI on Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "**/*.gdextension"
      - ".github/workflows/ci_windows.yaml"

  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "**/*.gdextension"
      - ".github/workflows/ci_windows.yaml"

jobs:
  run_test:
    name: "run tests"
    strategy:
      fail-fast: true
      matrix:
        targets:
          - windows/amd64
    runs-on: windows-latest
    env:
      GODOT: ./Godot_v4.7-stable_win64.exe
    timeout-minutes: 20
    steps:
      - name: Add Go 1.27 To System Path
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: go version
      - name: Set up scoop
        uses: MinoruSekine/setup-scoop@main
        with:
          scoop_checkup: 'true'
      - name: Set up scoop extras
        run: scoop bucket add extras;
      - name: Install scoop packages
        run: scoop install wget unzip
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Godot 4.7 stable
        run: |
          wget https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip
          unzip Godot_v4.7-stable_win64.exe.zip -d ./
        shell: bash

      # Download custom build of godot for windows
      # - name: Download Godot binary
      #   uses: dawidd6/action-download-artifact@v2
      #   with:
      #     workflow: ci_build_godot_windows.yaml
      #     workflow_conclusion: success
      #     name: godot-windows-editor-amd64
      #     path: bin/

      - name: Update Godot Headers
        run: |
          make update_godot_headers_from_binary

      - name: Code Generation
        run: |
          PATH=$PATH:$(go env GOPATH)/bin make generate
        shell: bash

      # Temporary diagnostic (windows-pdb-line-info): dwarf2codeview ICEs on
      # stacktrace.c only — other cgo TUs compile fine. Bisect the crashing
      # construct with minimal TUs, verify ld --pdb end-to-end, and pre-verify
      # the CaptureStackBackTrace replacement shape. The Makefile pins the
      # winning configuration and this step comes out.
      - name: Probe CodeView Compiler Flags
        continue-on-error: true
        run: |
          echo "GCC-VERSION: $(gcc --version | head -1)"
          mkdir -p /tmp/cvprobe
          cat > /tmp/cvprobe/p1.c <<'EOF'
          int p1(void) { return 0; }
          EOF
          cat > /tmp/cvprobe/p2.c <<'EOF'
          #include <windows.h>
          int p2(void) { static SRWLOCK lk = {0}; AcquireSRWLockExclusive(&lk); ReleaseSRWLockExclusive(&lk); return 0; }
          EOF
          cat > /tmp/cvprobe/p3.c <<'EOF'
          #include <string.h>
          #include <windows.h>
          int p3(void) { CONTEXT ctx; memset(&ctx, 0, sizeof(ctx)); ctx.ContextFlags = CONTEXT_FULL; return (int)ctx.Rip; }
          EOF
          cat > /tmp/cvprobe/p4.c <<'EOF'
          #include <windows.h>
          int p4(void) { CONTEXT ctx; RtlCaptureContext(&ctx); return (int)ctx.Rip; }
          EOF
          cat > /tmp/cvprobe/p5.c <<'EOF'
          #include <string.h>
          #include <windows.h>
          #include <dbghelp.h>
          int p5(void) {
              STACKFRAME64 sf;
              IMAGEHLP_LINE64 sl;
              char buf[sizeof(SYMBOL_INFO) + MAX_SYM_NAME * sizeof(CHAR)];
              PSYMBOL_INFO sy = (PSYMBOL_INFO)buf;
              DWORD ld = 0;
              ZeroMemory(&sf, sizeof(sf));
              ZeroMemory(&sl, sizeof(sl));
              sl.SizeOfStruct = sizeof(sl);
              sy->MaxNameLen = MAX_SYM_NAME;
              return (int)(sf.AddrPC.Offset + sl.LineNumber + ld);
          }
          EOF
          cat > /tmp/cvprobe/p6.c <<'EOF'
          #include <stdio.h>
          #include <string.h>
          #include <windows.h>
          #include <dbghelp.h>
          int p6(void) {
              void *addrs[16];
              unsigned short n = CaptureStackBackTrace(0, 16, addrs, NULL);
              char buf[sizeof(SYMBOL_INFO) + MAX_SYM_NAME * sizeof(CHAR)];
              PSYMBOL_INFO sym = (PSYMBOL_INFO)buf;
              IMAGEHLP_LINE64 line;
              DWORD lineDisp = 0;
              DWORD64 disp = 0;
              unsigned short i;
              SymSetOptions(SYMOPT_UNDNAME | SYMOPT_DEFERRED_LOADS | SYMOPT_LOAD_LINES);
              SymInitialize(GetCurrentProcess(), NULL, TRUE);
              for (i = 0; i < n; i++) {
                  sym->SizeOfStruct = sizeof(SYMBOL_INFO);
                  sym->MaxNameLen = MAX_SYM_NAME;
                  if (SymFromAddr(GetCurrentProcess(), (DWORD64)addrs[i], &disp, sym)) {
                      memset(&line, 0, sizeof(line));
                      line.SizeOfStruct = sizeof(line);
                      if (SymGetLineFromAddr64(GetCurrentProcess(), (DWORD64)addrs[i], &lineDisp, &line)) {
                          printf("%s+0x%llx %s:%lu\n", sym->Name, (unsigned long long)disp,
                              line.FileName, line.LineNumber);
                      }
                  }
              }
              SymCleanup(GetCurrentProcess());
              return (int)n;
          }
          EOF
          for f in /tmp/cvprobe/p*.c; do
            if gcc -gcodeview -c "$f" -o "$f.o" 2>/tmp/cvprobe/err.txt; then
              echo "PROBE-OK compile $f"
            else
              echo "PROBE-FAIL compile $f: $(grep -m1 . /tmp/cvprobe/err.txt)"
            fi
          done
          if gcc -gcodeview /tmp/cvprobe/p1.c -o /tmp/cvprobe/p1.exe -Wl,--pdb=/tmp/cvprobe/p1.pdb 2>/tmp/cvprobe/err.txt; then
            if [ -f /tmp/cvprobe/p1.pdb ]; then echo "PROBE-OK link-pdb"; else echo "PROBE-FAIL link-pdb: no pdb emitted"; fi
          else
            echo "PROBE-FAIL link-pdb: $(grep -m1 . /tmp/cvprobe/err.txt)"
          fi
        shell: bash

      - name: Build
        run: |
          make build
        shell: bash

      - name: List Artifacts Directory
        run: |
          ls -alh test/demo/lib
          ls -alh test/demo/
        shell: bash

      - name: Gen Test Project Files
        timeout-minutes: 3
        run: make ci_gen_test_project_files
        continue-on-error: true
        env:
          CI: 1
          LOG_LEVEL: "debug"
          LANG: "en_US.utf8"

      - name: Test
        timeout-minutes: 7
        run: make test
        continue-on-error: true
        shell: bash
        env:
          CI: 1
          LOG_LEVEL: "debug"
          LANG: "en_US.utf8"

      # The Test step above is continue-on-error (the pre-existing teardown
      # segfault is tracked separately), so the runtime gate's stacktrace
      # rules alone cannot fail this job. test-output.log is tee'd by make
      # test and survives that masked failure; assert the capture evidence
      # directly so a silently broken Windows capture can never go green.
      - name: Verify Stacktrace Capture Evidence
        run: |
          grep -qa 'stacktrace-probe capture=1' test-output.log || {
            echo "::error::stacktrace probe did not report native capture available"
            exit 1
          }
          grep -qa '___ C start backtrace ___' test-output.log || {
            echo "::error::capture reported available but no backtrace banner was printed"
            exit 1
          }
          # With a linked PDB (windows-pdb-line-info) at least one captured
          # frame must name its source line. If debug-info loading silently
          # stops (PDB missing, GUID mismatch), frames degrade to offset-only
          # and every check above still looks healthy.
          awk '/___ C start backtrace ___/{inb=1} inb{print} /___ C end backtrace/{if(inb) exit}' test-output.log \
            | grep -qaE '[A-Za-z0-9_.-]+\.(c|h|s):[0-9]+' || {
            echo "::error::no captured frame carried file:line — the PDB is missing, stale, or not loaded next to the DLL"
            exit 1
          }
          echo "windows stacktrace capture verified"
        shell: bash

      # A trace pasted from CI must be resolvable after the fact: keep the
      # debug library and the run log so module+0xoffset frames can be fed to
      # `go tool addr2line` offline. Uploaded unconditionally so the evidence
      # exists even when a later step trips over the masked teardown failure.
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-lib
          path: |
            test-output.log
            test/demo/lib/*.dll
            test/demo/lib/*.pdb
          if-no-files-found: warn
          retention-days: 14
