name: godot-go CI on Linux

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "**/*.gdextension"
      - ".github/workflows/ci_linux.yaml"

  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "**/*.gdextension"
      - ".github/workflows/ci_linux.yaml"

jobs:
  run_test:
    name: "run tests"
    strategy:
      fail-fast: true
      matrix:
        os:
          - linux
        arch:
          - amd64

    runs-on: ubuntu-latest
    env:
      GODOT: /usr/local/bin/godot
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Add Go 1.27 To System Path
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - run: go version

      - run: mkdir -p bin/

      - name: Install Godot 4.7 stable
        run: |
          wget https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          sudo unzip Godot_v4.7-stable_linux.x86_64.zip -d /usr/local/bin
          sudo ln -s Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot

      # - name: Download Godot binary
      #   uses: dawidd6/action-download-artifact@v2
      #   with:
      #     workflow: ci_build_godot_linux.yaml
      #     workflow_conclusion: success
      #     name: godot-linuxbsd-editor-amd64
      #     path: bin/

      - name: Setup Godot binary
        run: |
          sudo chmod +x /usr/local/bin/godot
          ls -alh /usr/local/bin/

      - name: Update Godot Headers
        run: |
          make update_godot_headers_from_binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}

      - name: Code Generation
        run: |
          PATH=$PATH:$(go env GOPATH)/bin make generate
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}

      - run: git diff

      - name: Build
        run: make build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}

      - name: List Artifacts Directory
        run: |
          ls -alh test/demo/lib

      - name: Gen Test Project Files
        if: ${{ matrix.os == 'linux' }}
        timeout-minutes: 3
        run: |
          make ci_gen_test_project_files
        env:
          CI: 1
          LOG_LEVEL: "debug"
          LANG: "en_US.utf8"

      - name: Test
        if: ${{ matrix.os == 'linux' }}
        # The build prerequisite is binary: cache hit (instant, silent) or a
        # wedged rebuild (stalled cgo, the flake that killed runs at 2 min
        # with zero slack left for the ~1m50s suite). Budget a full rebuild
        # (~2.5min with the -N -l gcflags invalidating the toolchain cache)
        # plus the suite with margin.
        timeout-minutes: 5
        run: |
          make test
        env:
          CI: 1
          LOG_LEVEL: "debug"
          LANG: "en_US.utf8"

      # Recorded benchmarks and the gate script's own fixture suite stay out
      # of `make test`; CI runs them as separate steps so a gate-script
      # regression (which only run_fixture_tests.sh can catch) still fails
      # the build, attributed by step name instead of bundling ~a minute of
      # engine-free benchmarks into the gated test step.
      - name: Benchmark
        if: ${{ matrix.os == 'linux' }}
        timeout-minutes: 5
        run: |
          make benchmark
        env:
          CI: 1
          LANG: "en_US.utf8"

      - name: Integration Test
        if: ${{ matrix.os == 'linux' }}
        timeout-minutes: 5
        run: |
          make integration_test
        env:
          CI: 1
          LANG: "en_US.utf8"

  build_alpine:
    name: "build on alpine (musl)"
    runs-on: ubuntu-latest
    container:
      image: golang:1.27-alpine
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install C toolchain
        run: apk add --no-cache build-base

      - name: Code Generation
        run: make generate

      - name: Build (musl default, C backtrace compiled out)
        run: make build

      - name: Build (musl opt-in C backtrace via external execinfo implementation)
        run: |
          # Alpine repos ship no installable execinfo implementation (verified
          # 2026-10: no libexecinfo package in main/community/testing; libunwind
          # and gcompat export no backtrace symbols), so exercise the opt-in
          # path against a minimal execinfo-ABI shim -- the same contract any
          # real external library must satisfy.
          mkdir -p /tmp/execinfo-shim
          printf '%s\n' \
            '#ifndef GODOTGO_EXECINFO_SHIM_H' \
            '#define GODOTGO_EXECINFO_SHIM_H' \
            'int backtrace(void **buffer, int size);' \
            'char **backtrace_symbols(void *const *buffer, int size);' \
            '#endif' > /tmp/execinfo-shim/execinfo.h
          printf '%s\n' \
            '#include "execinfo.h"' \
            '#include <stdlib.h>' \
            'int backtrace(void **buffer, int size) { (void)buffer; (void)size; return 0; }' \
            'char **backtrace_symbols(void *const *buffer, int size) { (void)buffer; (void)size; return calloc(1, sizeof(char *)); }' > /tmp/execinfo-shim/shim.c
          cc -shared -fPIC -o /tmp/execinfo-shim/libexecinfo.so /tmp/execinfo-shim/shim.c
          make build EXTRA_CGO_CFLAGS='-DGODOT_GO_ENABLE_EXECINFO -I/tmp/execinfo-shim' EXTRA_CGO_LDFLAGS='-L/tmp/execinfo-shim -lexecinfo'

      - name: List Artifacts Directory
        run: ls -alh test/demo/lib
